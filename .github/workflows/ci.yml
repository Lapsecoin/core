name: CI

# Fast check on every push and pull request: only the tests the changed files
# can reach (see scripts/select_tests.py). The release workflow still runs
# the whole suite before anything ships.

on:
  push:
    branches: [main]
    paths-ignore:
      - VERSION
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Pick the tests this change can affect
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=""
          fi
          if [ -z "$BASE" ]; then
            SELECTION=ALL
          else
            SELECTION=$(python scripts/select_tests.py --base "$BASE")
          fi
          echo "$SELECTION"
          {
            echo "tests<<EOF"
            echo "$SELECTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install liboqs system dependencies
        if: steps.pick.outputs.tests != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libssl-dev

      - name: Install dependencies
        if: steps.pick.outputs.tests != ''
        run: pip install -r requirements.txt

      - name: Run the selected tests
        if: steps.pick.outputs.tests != ''
        run: |
          SELECTION='${{ steps.pick.outputs.tests }}'
          if [ "$SELECTION" = "ALL" ]; then
            pytest tests/ -v --durations=15
          else
            pytest $SELECTION -v --durations=15
          fi
