name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      full_tests:
        description: "Run the whole test suite instead of only the tests the changes since the last release can reach"
        type: boolean
        default: false

env:
  # Pinned so the cached build below is reproducible. Keep it matched to the
  # liboqs-python release pip installs (its version prints a warning at import
  # when the two disagree). Bumping it rebuilds once, then caches again.
  LIBOQS_REF: "0.16.0"

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag:      ${{ steps.read.outputs.tag }}
      prev_ver: ${{ steps.read.outputs.prev_ver }}
      severity: ${{ steps.read.outputs.severity }}
      title:    ${{ steps.read.outputs.title }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Read VERSION and previous VERSION
        id: read
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION must be semver (e.g. 1.2.3), got: $VERSION"
            exit 1
          fi
          PREV=$(git show HEAD~1:VERSION 2>/dev/null | tr -d '[:space:]' || echo "")

          # Same severity rule as src/update_check.py's classify_update():
          # first component (major) changed -> protocol (wire/consensus
          # break likely); second component (minor) changed -> critical;
          # otherwise a routine patch bump. Keep these in sync.
          SEVERITY="minor"
          TITLE_PREFIX=""
          if echo "$PREV" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            V_MAJ=$(echo "$VERSION" | cut -d. -f1); V_MIN=$(echo "$VERSION" | cut -d. -f2)
            P_MAJ=$(echo "$PREV"    | cut -d. -f1); P_MIN=$(echo "$PREV"    | cut -d. -f2)
            if [ "$V_MAJ" != "$P_MAJ" ]; then
              SEVERITY="protocol"
              TITLE_PREFIX="[PROTOCOL CHANGE] "
            elif [ "$V_MIN" != "$P_MIN" ]; then
              SEVERITY="critical"
              TITLE_PREFIX="[CRITICAL] "
            fi
          fi

          echo "tag=v$VERSION"      >> "$GITHUB_OUTPUT"
          echo "prev_ver=$PREV"     >> "$GITHUB_OUTPUT"
          echo "severity=$SEVERITY" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE_PREFIX}LapseCoin v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag does not already exist
        run: |
          TAG=${{ steps.read.outputs.tag }}
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "ERROR: tag $TAG already exists"
            exit 1
          fi


  set-genesis:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GENESIS_TIMESTAMP if TESTNET=True
        if: ${{ vars.TESTNET == 'True' }}
        run: |
          TIMESTAMP=$(python3 -c "import time; print(int(time.time()))")
          sed -i "s/^GENESIS_TIMESTAMP = .*/GENESIS_TIMESTAMP = $TIMESTAMP/" src/params.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/params.py
          git commit -m "chore: set GENESIS_TIMESTAMP=$TIMESTAMP for ${{ needs.version.outputs.tag }}"
          git push origin main

  test:
    needs: [version, set-genesis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Only the tests reachable from what changed since the last release
      # (scripts/select_tests.py). Anything it cannot place, a missing
      # previous tag, or full_tests on a manual run, falls back to the
      # whole suite.
      - name: Pick the tests this release can affect
        id: pick
        run: |
          PREV="${{ needs.version.outputs.prev_ver }}"
          SELECTION=ALL
          if [ "${{ inputs.full_tests }}" != "true" ] && [ -n "$PREV" ] \
             && git rev-parse -q --verify "refs/tags/v$PREV" >/dev/null; then
            SELECTION=$(python scripts/select_tests.py --base "v$PREV")
          fi
          echo "Selection: ${SELECTION:-<nothing>}"
          {
            echo "tests<<EOF"
            echo "$SELECTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Install liboqs system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libssl-dev

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-xdist

      # One worker per core. loadfile keeps each test file on a single
      # worker, so tests inside a file still run in order together.
      - name: Run tests
        run: |
          SELECTION='${{ steps.pick.outputs.tests }}'
          if [ "$SELECTION" = "ALL" ]; then
            pytest tests/ -v --durations=15 -n auto --dist loadfile
          elif [ -z "$SELECTION" ]; then
            echo "No test can be affected by the changes since the last release."
          else
            pytest $SELECTION -v --durations=15 -n auto --dist loadfile
          fi

  # The builds run alongside the tests instead of after them (the release
  # takes as long as the slowest of the two, not the sum). Nothing is
  # published until the tests have also passed: publish-pypi and release both
  # need test. A failure later reverts VERSION but cannot unpublish from PyPI,
  # so bump to a new version to ship different code after such a failure.
  build-linux:
    needs: [version, set-genesis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libssl-dev libcairo2-dev pkg-config python3-dev python3-tk

      # liboqs is the slowest thing to build and only changes when the
      # pinned tag below does, so its install tree is cached and copied
      # into place on a hit.
      - name: Restore prebuilt liboqs
        id: liboqs-cache
        uses: actions/cache@v5
        with:
          path: ~/liboqs-install
          key: liboqs-linux-${{ env.LIBOQS_REF }}

      - name: Build liboqs
        if: steps.liboqs-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LIBOQS_REF" https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cmake -S /tmp/liboqs -B /tmp/liboqs/build \
            -DOQS_ALGS_ENABLED=STD \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/liboqs-install"
          cmake --build /tmp/liboqs/build -j$(nproc)
          cmake --install /tmp/liboqs/build

      - name: Install liboqs system-wide
        run: |
          sudo cp -a "$HOME/liboqs-install/." /usr/local/
          sudo ldconfig

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          # Not in requirements.txt: it's a C extension with no prebuilt
          # wheels, so requiring it there breaks plain source installs on
          # machines without a compiler (see git history). CI runners have
          # one by default, so it's installed here instead, purely for the
          # release binary; the app already runs fine without it either way.
          pip install pyinstaller cairosvg Pillow miniupnpc

      - name: Install appimagetool
        run: |
          wget -qL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Build AppImage
        run: make linux

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: lapsecoin-linux
          path: dist/lapsecoin

  build-windows:
    needs: [version, set-genesis]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # The icons only change when the SVG does, so they are cached by its
      # hash and neither cairo nor the render step runs on a hit.
      - name: Restore generated icons
        id: icons-cache
        uses: actions/cache@v5
        with:
          path: |
            favicon.ico
            lapsecoin.png
          key: icons-${{ hashFiles('lapsecoin.svg') }}

      - name: Install cairo via MSYS2
        if: steps.icons-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: C:\msys64\usr\bin\bash -lc "pacman -S --noconfirm mingw-w64-x86_64-cairo"

      - name: Restore prebuilt liboqs
        id: liboqs-cache
        uses: actions/cache@v5
        with:
          path: C:/liboqs/install
          key: liboqs-windows-${{ env.LIBOQS_REF }}

      # Only needed to compile liboqs, so skipped when the cache has it: the
      # OpenSSL installer alone is a 250 MB download.
      - name: Install liboqs build dependencies
        if: steps.liboqs-cache.outputs.cache-hit != 'true'
        run: |
          choco install cmake ninja openssl --no-progress -y
          echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Build liboqs
        if: steps.liboqs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:LIBOQS_REF https://github.com/open-quantum-safe/liboqs.git C:/liboqs
          cmake -S C:/liboqs -B C:/liboqs/build `
            -G Ninja `
            -DOQS_ALGS_ENABLED=STD `
            -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="C:/liboqs/install"
          cmake --build C:/liboqs/build -j4
          cmake --install C:/liboqs/build

      - name: Put liboqs on PATH
        shell: pwsh
        run: echo "C:\liboqs\install\bin" >> $env:GITHUB_PATH

      - name: Install Visual C++ redistributable
        run: choco install vcredist140 --no-progress -y
        shell: pwsh

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Not in requirements.txt: it's a C extension with no prebuilt
          # wheels, so requiring it there breaks plain source installs on
          # machines without a compiler (see git history). CI runners have
          # one by default, so it's installed here instead, purely for the
          # release binary; the app already runs fine without it either way.
          pip install cairosvg Pillow miniupnpc

      # Pinned: 4.3 crashes on exit when a program leaves through sys.exit
      # (a segfault in logging.shutdown); 4.2.2 and earlier do not.
      - name: Install Nuitka
        run: pip install nuitka==4.2.2 zstandard ordered-set

      - name: Generate icons
        if: steps.icons-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          & "$env:pythonLocation\python.exe" -c 'import cairosvg,io; from PIL import Image; imgs=[Image.open(io.BytesIO(cairosvg.svg2png(url="lapsecoin.svg",output_width=s,output_height=s))).convert("RGBA") for s in [16,32,48]]; imgs[0].save("favicon.ico",format="ICO",sizes=[(16,16),(32,32),(48,48)],append_images=imgs[1:]); open("lapsecoin.png","wb").write(cairosvg.svg2png(url="lapsecoin.svg",output_width=512,output_height=512)); print("icons generated")'

      # Nuitka compiles the Python to C, which is the slow part. Its compiler
      # cache (object files of code that did not change) is kept between
      # releases, so only what changed is compiled again.
      - name: Restore the Nuitka compiler cache
        uses: actions/cache/restore@v5
        with:
          path: nuitka-cache
          key: nuitka-windows-${{ hashFiles('requirements.txt', 'scripts/build_windows.ps1') }}-${{ github.run_id }}
          restore-keys: |
            nuitka-windows-${{ hashFiles('requirements.txt', 'scripts/build_windows.ps1') }}-
            nuitka-windows-

      - name: Build the program
        shell: pwsh
        run: |
          $env:NUITKA_CACHE_DIR = "$PWD\nuitka-cache"
          $v = (Get-Content VERSION).Trim()
          .\scripts\build_windows.ps1 -Version $v

      # Saved even when a later step fails: a build that gets as far as the
      # compiler has already paid for the object files, and a failed run should
      # not throw that away.
      - name: Save the Nuitka compiler cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: nuitka-cache
          key: nuitka-windows-${{ hashFiles('requirements.txt', 'scripts/build_windows.ps1') }}-${{ github.run_id }}

      # A windowed program does not hold the console, so wait on the process
      # and read its exit code instead of trusting the shell to.
      - name: Smoke test the program
        shell: pwsh
        run: |
          $p = Start-Process dist\lapsecoin-win\lapsecoin.exe -ArgumentList '-h' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the program exited with $($p.ExitCode)" }

      - name: Install the WiX Toolset
        run: choco install wixtoolset --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          .\scripts\build_msi.ps1 -Source dist\lapsecoin-win -Version $v -Out lapsecoin.msi

      # The installer is the thing most likely to be wrong the first time it
      # runs somewhere real, so install it on the runner, check the result,
      # and remove it again, before anything is published.
      - name: Install the installer on the runner and check it
        shell: pwsh
        run: |
          # Every check runs, and every failure is reported together, because
          # each run of this job is a 30 minute round trip.
          $failures = @()
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\LapseCoin'
          $data = Join-Path $env:LOCALAPPDATA 'LapseCoin'

          $p = Start-Process msiexec -ArgumentList '/i', "$PWD\lapsecoin.msi", '/qn', 'LAUNCH=0', '/l*v', "$PWD\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $failures += "install exited $($p.ExitCode)"
            Get-Content install.log -Tail 80
          }
          foreach ($f in 'lapsecoin.exe', 'installed-by-msi') {
            if (-not (Test-Path (Join-Path $dir $f))) { $failures += "missing $f after install" }
          }

          $shortcuts = @(
            (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\LapseCoin.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'LapseCoin.lnk'))
          foreach ($lnk in $shortcuts) {
            if (-not (Test-Path $lnk)) { $failures += "missing shortcut $lnk" }
          }

          # The program is windowed, so wait on the process for its exit code.
          if (Test-Path "$dir\lapsecoin.exe") {
            $run = Start-Process "$dir\lapsecoin.exe" -ArgumentList '-h' -Wait -PassThru
            if ($run.ExitCode -ne 0) { $failures += "installed app exited $($run.ExitCode) on -h" }
          }
          if (-not (Test-Path $data)) { $failures += "the app did not make its data folder" }
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Select-Object -First 40 | Format-Table Name, Length

          $u = Start-Process msiexec -ArgumentList '/x', "$PWD\lapsecoin.msi", '/qn' -Wait -PassThru
          if ($u.ExitCode -ne 0) { $failures += "uninstall exited $($u.ExitCode)" }
          if (Test-Path (Join-Path $dir 'lapsecoin.exe')) { $failures += "uninstall left the program behind" }
          foreach ($lnk in $shortcuts) {
            if (Test-Path $lnk) { $failures += "uninstall left $lnk behind" }
          }

          if ($failures) { $failures | ForEach-Object { Write-Host "FAILED: $_" }; exit 1 }
          Write-Host "install, start and uninstall all worked"

      - name: Stage the release files
        shell: pwsh
        run: |
          New-Item stage -ItemType Directory | Out-Null
          Copy-Item lapsecoin.msi                stage\lapsecoin.msi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: lapsecoin-windows
          path: stage/*

  publish-pypi:
    # After both builds, so a version never reaches PyPI when its binaries
    # failed to build.
    needs: [version, test, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing (OIDC): PyPI checks this token against the
      # pending publisher registered on the project page (repo + this
      # workflow file), so there's no PYPI_API_TOKEN secret to hold or
      # rotate. First successful publish from here claims the project
      # under whichever PyPI account registered that pending publisher.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI never accepts the same version twice, so a re-run of the
          # release at the same version skips the upload instead of failing.
          skip-existing: true

  release:
    needs: [version, test, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v6
        with:
          name: lapsecoin-linux
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v6
        with:
          name: lapsecoin-windows
          path: artifacts/windows

      - name: Make AppImage executable
        run: chmod +x artifacts/linux/lapsecoin

      - name: Checksums
        run: |
          cd artifacts
          sha256sum linux/lapsecoin windows/lapsecoin.msi \
            | sed 's# \(linux\|windows\)/# #' > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "${{ needs.version.outputs.tag }}" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          git log "$RANGE" --shortstat --pretty=format:"%h %s" | awk '
            /^[a-f0-9]/ { hash=$0 }
            /files? changed/ {
              match($0, /([0-9]+) insertion/, ins)
              match($0, /([0-9]+) deletion/, del)
              total = ins[1] + del[1]
              print total " " hash
            }
          ' | sort -rn | head -10 | awk '{$1=""; print NR"."$0}' > /tmp/largest.txt

          SEVERITY="${{ needs.version.outputs.severity }}"
          case "$SEVERITY" in
            protocol) SEVERITY_LINE="**Protocol change** -- old and new nodes may not sync with each other. Upgrade recommended." ;;
            critical) SEVERITY_LINE="**Critical update** -- upgrading is recommended." ;;
            *)        SEVERITY_LINE="Routine update." ;;
          esac

          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "## ${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "$SEVERITY_LINE" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Windows: the installer is not code signed, so SmartScreen may warn on first run (More info, then Run anyway). Check the download against SHA256SUMS." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### 10 largest commits" >> "$GITHUB_OUTPUT"
          cat /tmp/largest.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.title }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: |
            artifacts/linux/lapsecoin
            artifacts/windows/lapsecoin.msi
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  revert-on-failure:
    # publish-pypi deliberately isn't in this list: it runs alongside the
    # release job once both builds have passed, so the GitHub release with
    # real binaries is public whether or not the publish works, and rolling
    # the version back would just orphan it. A failed PyPI publish should fail
    # loudly and get re-run on its own (skip-existing makes that safe), not
    # roll back a release that already succeeded.
    needs: [version, set-genesis, test, build-linux, build-windows, release]
    runs-on: ubuntu-latest
    if: |
      always() && (
        needs.version.result       == 'failure' ||
        needs.set-genesis.result   == 'failure' ||
        needs.test.result          == 'failure' ||
        needs.build-linux.result   == 'failure' ||
        needs.build-windows.result == 'failure' ||
        needs.release.result       == 'failure'
      )
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revert VERSION and GENESIS_TIMESTAMP
        run: |
          PREV="${{ needs.version.outputs.prev_ver }}"
          TAG="${{ needs.version.outputs.tag }}"
          if [ -z "$PREV" ]; then
            echo "No previous version available -- cannot revert"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          echo "$PREV" > VERSION
          if [ "${{ vars.TESTNET }}" = "True" ]; then
            sed -i "s/^GENESIS_TIMESTAMP = .*/GENESIS_TIMESTAMP = 0/" src/params.py
            git add VERSION src/params.py
          else
            git add VERSION
          fi
          git commit -m "revert: VERSION back to $PREV ($TAG release failed)"
          git push origin main
          git push origin :refs/tags/$TAG || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
