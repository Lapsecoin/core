name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      full_tests:
        description: "Run the whole test suite instead of only the tests the changes since the last release can reach"
        type: boolean
        default: false

env:
  # Pinned so the cached build below is reproducible. Keep it matched to the
  # liboqs-python release pip installs (its version prints a warning at import
  # when the two disagree). Bumping it rebuilds once, then caches again.
  LIBOQS_REF: "0.16.0"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag:      ${{ steps.read.outputs.tag }}
      prev_ver: ${{ steps.read.outputs.prev_ver }}
      severity: ${{ steps.read.outputs.severity }}
      title:    ${{ steps.read.outputs.title }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Read VERSION and previous VERSION
        id: read
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION must be semver (e.g. 1.2.3), got: $VERSION"
            exit 1
          fi
          PREV=$(git show HEAD~1:VERSION 2>/dev/null | tr -d '[:space:]' || echo "")

          # Same severity rule as src/update_check.py's classify_update():
          # first component (major) changed -> protocol (wire/consensus
          # break likely); second component (minor) changed -> critical;
          # otherwise a routine patch bump. Keep these in sync.
          SEVERITY="minor"
          TITLE_PREFIX=""
          if echo "$PREV" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            V_MAJ=$(echo "$VERSION" | cut -d. -f1); V_MIN=$(echo "$VERSION" | cut -d. -f2)
            P_MAJ=$(echo "$PREV"    | cut -d. -f1); P_MIN=$(echo "$PREV"    | cut -d. -f2)
            if [ "$V_MAJ" != "$P_MAJ" ]; then
              SEVERITY="protocol"
              TITLE_PREFIX="[PROTOCOL CHANGE] "
            elif [ "$V_MIN" != "$P_MIN" ]; then
              SEVERITY="critical"
              TITLE_PREFIX="[CRITICAL] "
            fi
          fi

          echo "tag=v$VERSION"      >> "$GITHUB_OUTPUT"
          echo "prev_ver=$PREV"     >> "$GITHUB_OUTPUT"
          echo "severity=$SEVERITY" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE_PREFIX}LapseCoin v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag does not already exist
        run: |
          TAG=${{ steps.read.outputs.tag }}
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "ERROR: tag $TAG already exists"
            exit 1
          fi


  set-genesis:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GENESIS_TIMESTAMP if TESTNET=True
        if: ${{ vars.TESTNET == 'True' }}
        run: |
          TIMESTAMP=$(python3 -c "import time; print(int(time.time()))")
          sed -i "s/^GENESIS_TIMESTAMP = .*/GENESIS_TIMESTAMP = $TIMESTAMP/" src/params.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/params.py
          git commit -m "chore: set GENESIS_TIMESTAMP=$TIMESTAMP for ${{ needs.version.outputs.tag }}"
          git push origin main

  test:
    needs: [version, set-genesis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Only the tests reachable from what changed since the last release
      # (scripts/select_tests.py). Anything it cannot place, a missing
      # previous tag, or full_tests on a manual run, falls back to the
      # whole suite.
      - name: Pick the tests this release can affect
        id: pick
        run: |
          PREV="${{ needs.version.outputs.prev_ver }}"
          SELECTION=ALL
          if [ "${{ inputs.full_tests }}" != "true" ] && [ -n "$PREV" ] \
             && git rev-parse -q --verify "refs/tags/v$PREV" >/dev/null; then
            SELECTION=$(python scripts/select_tests.py --base "v$PREV")
          fi
          echo "Selection: ${SELECTION:-<nothing>}"
          {
            echo "tests<<EOF"
            echo "$SELECTION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Without liboqs on the machine, liboqs-python compiles it from source
      # the first time the tests import it: about five minutes of a job whose
      # tests take under one. The Linux build below keeps the finished install
      # in this cache; it is restored here without ever being saved from this
      # job, and when it is missing (a new LIBOQS_REF the build has not
      # stored yet) everything falls back to the build from source, as before.
      - name: Restore prebuilt liboqs
        id: liboqs-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/liboqs-install
          key: liboqs-linux-${{ env.LIBOQS_REF }}

      - name: Install prebuilt liboqs system-wide
        if: steps.liboqs-cache.outputs.cache-hit == 'true'
        run: |
          sudo cp -a "$HOME/liboqs-install/." /usr/local/
          sudo ldconfig

      - name: Install liboqs system dependencies
        if: steps.liboqs-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libssl-dev

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-xdist

      # The HD wallet's seeded Falcon key generation (native/falcon_seeded).
      # Without it the tests that need it skip instead of running.
      - name: Build the seeded Falcon library
        run: make -C native/falcon_seeded

      # One worker per core. loadfile keeps each test file on a single
      # worker, so tests inside a file still run in order together.
      - name: Run tests
        run: |
          SELECTION='${{ steps.pick.outputs.tests }}'
          if [ "$SELECTION" = "ALL" ]; then
            pytest tests/ -v --durations=15 -n auto --dist loadfile
          elif [ -z "$SELECTION" ]; then
            echo "No test can be affected by the changes since the last release."
          else
            pytest $SELECTION -v --durations=15 -n auto --dist loadfile
          fi

  # The builds run alongside the tests instead of after them (the release
  # takes as long as the slowest of the two, not the sum). Nothing is
  # published until the tests have also passed: the release needs test, and
  # publish-pypi needs the release, so PyPI goes last. A failure before that
  # reverts VERSION with nothing on PyPI; once a version is on PyPI it cannot
  # be taken back, so bump to a new version to ship different code after a
  # failure of the publish itself.
  build-linux:
    needs: [version, set-genesis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libssl-dev libcairo2-dev pkg-config python3-dev python3-tk

      # liboqs is the slowest thing to build and only changes when the
      # pinned tag below does, so its install tree is cached and copied
      # into place on a hit.
      - name: Restore prebuilt liboqs
        id: liboqs-cache
        uses: actions/cache@v5
        with:
          path: ~/liboqs-install
          key: liboqs-linux-${{ env.LIBOQS_REF }}

      - name: Build liboqs
        if: steps.liboqs-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LIBOQS_REF" https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cmake -S /tmp/liboqs -B /tmp/liboqs/build \
            -DOQS_ALGS_ENABLED=STD \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/liboqs-install"
          cmake --build /tmp/liboqs/build -j$(nproc)
          cmake --install /tmp/liboqs/build

      - name: Install liboqs system-wide
        run: |
          sudo cp -a "$HOME/liboqs-install/." /usr/local/
          sudo ldconfig

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          # Not in requirements.txt: it's a C extension with no prebuilt
          # wheels, so requiring it there breaks plain source installs on
          # machines without a compiler (see git history). CI runners have
          # one by default, so it's installed here instead, purely for the
          # release binary; the app already runs fine without it either way.
          pip install pyinstaller cairosvg Pillow miniupnpc

      - name: Install appimagetool
        run: |
          wget -qL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      # Bundled into the AppImage by lapsecoin.spec.
      - name: Build the seeded Falcon library
        run: make -C native/falcon_seeded

      - name: Build AppImage
        run: make linux

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: lapsecoin-linux
          path: dist/lapsecoin

  build-windows:
    needs: [version, set-genesis]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # The cache key covers the build tools too (scripts/requirements-windows-build.txt),
      # so Nuitka's wheel is built once and not on every release.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/requirements-windows-build.txt

      # The icons only change when the SVG does, so they are cached by its
      # hash and neither cairo nor the render step runs on a hit.
      - name: Restore generated icons
        id: icons-cache
        uses: actions/cache@v5
        with:
          path: |
            favicon.ico
            lapsecoin.png
          key: icons-${{ hashFiles('lapsecoin.svg') }}

      - name: Install cairo via MSYS2
        if: steps.icons-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: C:\msys64\usr\bin\bash -lc "pacman -S --noconfirm mingw-w64-x86_64-cairo"

      - name: Restore prebuilt liboqs
        id: liboqs-cache
        uses: actions/cache@v5
        with:
          path: C:/liboqs/install
          key: liboqs-windows-${{ env.LIBOQS_REF }}

      # Only needed to compile liboqs, so skipped when the cache has it: the
      # OpenSSL installer alone is a 250 MB download.
      - name: Install liboqs build dependencies
        if: steps.liboqs-cache.outputs.cache-hit != 'true'
        run: |
          choco install cmake ninja openssl --no-progress -y
          echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Build liboqs
        if: steps.liboqs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:LIBOQS_REF https://github.com/open-quantum-safe/liboqs.git C:/liboqs
          cmake -S C:/liboqs -B C:/liboqs/build `
            -G Ninja `
            -DOQS_ALGS_ENABLED=STD `
            -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="C:/liboqs/install"
          cmake --build C:/liboqs/build -j4
          cmake --install C:/liboqs/build

      - name: Put liboqs on PATH
        shell: pwsh
        run: echo "C:\liboqs\install\bin" >> $env:GITHUB_PATH

      # The HD wallet's seeded Falcon key generation (native/falcon_seeded),
      # built next to oqs.dll so scripts/build_windows.ps1 packs it with it.
      - name: Build the seeded Falcon library
        shell: pwsh
        run: |
          cmake -S native/falcon_seeded -B C:/fs -DCMAKE_INSTALL_PREFIX=C:/liboqs/install
          cmake --build C:/fs --config Release
          cmake --install C:/fs --config Release
          if (-not (Test-Path C:/liboqs/install/bin/falcon_seeded.dll)) { throw "falcon_seeded.dll was not built" }

      - name: Install Visual C++ redistributable
        run: choco install vcredist140 --no-progress -y
        shell: pwsh

      # What is not in requirements.txt: miniupnpc is a C extension with no
      # prebuilt wheels, so requiring it there breaks plain source installs on
      # machines without a compiler (see git history). CI runners have one by
      # default, so it is installed here instead, purely for the release
      # binary; the app already runs fine without it either way. The rest of
      # that file is the icon rendering and Nuitka itself, with its pin.
      - name: Install dependencies and the build tools
        run: pip install -r requirements.txt -r scripts/requirements-windows-build.txt

      - name: Generate icons
        if: steps.icons-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          & "$env:pythonLocation\python.exe" -c 'import cairosvg,io; from PIL import Image; imgs=[Image.open(io.BytesIO(cairosvg.svg2png(url="lapsecoin.svg",output_width=s,output_height=s))).convert("RGBA") for s in [16,32,48]]; imgs[0].save("favicon.ico",format="ICO",sizes=[(16,16),(32,32),(48,48)],append_images=imgs[1:]); open("lapsecoin.png","wb").write(cairosvg.svg2png(url="lapsecoin.svg",output_width=512,output_height=512)); print("icons generated")'

      # Nuitka compiles the Python to C, which is the slow part. Its compiler
      # cache (object files of code that did not change) is kept between
      # releases, so only what changed is compiled again.
      - name: Restore the Nuitka compiler cache
        uses: actions/cache/restore@v5
        with:
          path: nuitka-cache
          key: nuitka-windows-${{ hashFiles('requirements.txt', 'scripts/build_windows.ps1') }}-${{ github.run_id }}
          restore-keys: |
            nuitka-windows-${{ hashFiles('requirements.txt', 'scripts/build_windows.ps1') }}-
            nuitka-windows-

      # Real-time scanning of the compiler's many small object files slows the
      # build. Only its scratch folders are left out: dist and the installer
      # stay scanned, so the smoke test below still fails if Defender
      # quarantines the program it just built. Skipped quietly if the runner
      # does not allow the change.
      - name: Keep Defender off the compiler's scratch folders
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "$PWD\build-nuitka", "$PWD\nuitka-cache"
            Write-Host "build-nuitka and nuitka-cache are excluded from real-time scanning"
          } catch {
            Write-Host "could not change the Defender settings, carrying on: $($_.Exception.Message)"
          }

      - name: Build the program
        shell: pwsh
        env:
          MSIX_STORE_ID: ${{ vars.MSIX_STORE_ID }}
          CRASH_REPORT_REPO: ${{ vars.CRASH_REPORT_REPO }}
          CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}
        run: |
          $env:NUITKA_CACHE_DIR = "$PWD\nuitka-cache"
          $v = (Get-Content VERSION).Trim()
          .\scripts\build_windows.ps1 -Version $v

      # Saved even when a later step fails: a build that gets as far as the
      # compiler has already paid for the object files, and a failed run should
      # not throw that away.
      - name: Save the Nuitka compiler cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: nuitka-cache
          key: nuitka-windows-${{ hashFiles('requirements.txt', 'scripts/build_windows.ps1') }}-${{ github.run_id }}

      # A windowed program does not hold the console, so wait on the process
      # and read its exit code instead of trusting the shell to.
      - name: Smoke test the program
        shell: pwsh
        run: |
          $p = Start-Process dist\lapsecoin-win\lapsecoin.exe -ArgumentList '-h' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the program exited with $($p.ExitCode)" }

      - name: Install the WiX Toolset
        run: choco install wixtoolset --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          .\scripts\build_msi.ps1 -Source dist\lapsecoin-win -Version $v -Out lapsecoin.msi

      # The installer is the thing most likely to be wrong the first time it
      # runs somewhere real, so install it on the runner, check the result,
      # and remove it again, before anything is published.
      - name: Install the installer on the runner and check it
        shell: pwsh
        timeout-minutes: 15
        run: |
          # Every check runs, and every failure is reported together, because
          # each run of this job is a 30 minute round trip.
          $failures = @()
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\LapseCoin'
          $data = Join-Path $env:USERPROFILE 'LapseCoin'

          # A program that does not finish must not hold the job until it is
          # cancelled (a cancelled step loses its log): after $seconds, say
          # what is running, stop it and record a failure.
          function Run($file, $arguments, $seconds, $what) {
            $proc = Start-Process $file -ArgumentList $arguments -PassThru
            $null = $proc.Handle
            if (-not $proc.WaitForExit($seconds * 1000)) {
              Write-Host "TIMED OUT after $seconds s: $what"
              Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'lapsecoin|msiexec' } |
                Select-Object ProcessId, ParentProcessId, Name, CommandLine | Format-List | Out-Host
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              $script:failures += "$what did not finish in $seconds seconds"
              return $null
            }
            return $proc
          }

          $p = Run msiexec @('/i', "$PWD\lapsecoin.msi", '/qn', 'LAUNCH=0', '/l*v', "$PWD\install.log") 180 'the install'
          if ($p -and $p.ExitCode -ne 0) {
            $failures += "install exited $($p.ExitCode)"
            Get-Content install.log -Tail 80
          }
          foreach ($f in 'lapsecoin.exe', 'installed-by-msi') {
            if (-not (Test-Path (Join-Path $dir $f))) { $failures += "missing $f after install" }
          }

          $shortcuts = @(
            (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\LapseCoin.lnk'),
            (Join-Path ([Environment]::GetFolderPath('Desktop')) 'LapseCoin.lnk'))
          foreach ($lnk in $shortcuts) {
            if (-not (Test-Path $lnk)) { $failures += "missing shortcut $lnk" }
          }

          # The program is windowed, so wait on the process for its exit code.
          if (Test-Path "$dir\lapsecoin.exe") {
            $run = Run "$dir\lapsecoin.exe" @('-h') 60 'the installed app with -h'
            if ($run -and $run.ExitCode -ne 0) { $failures += "installed app exited $($run.ExitCode) on -h" }

            # An update restarts the app through the helper script, so the
            # program it names must be the one that is running. A Nuitka
            # build reports a python.exe in sys.executable that does not
            # exist, which is what broke the Windows update before.
            $chk = Join-Path $env:RUNNER_TEMP 'restart-check.txt'
            $rc = Run "$dir\lapsecoin.exe" @('--check-restart-exe', $chk) 60 'the restart check'
            if (Test-Path $chk) { Get-Content $chk }
            if ($rc -and $rc.ExitCode -ne 0) { $failures += "an update would restart the wrong program (exit $($rc.ExitCode))" }
          }
          if (-not (Test-Path $data)) { $failures += "the app did not make its data folder" }
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Select-Object -First 40 | Format-Table Name, Length

          $u = Run msiexec @('/x', "$PWD\lapsecoin.msi", '/qn', '/l*v', "$PWD\uninstall.log") 180 'the uninstall'
          if (-not $u -and (Test-Path uninstall.log)) { Get-Content uninstall.log -Tail 60 }
          if ($u -and $u.ExitCode -ne 0) { $failures += "uninstall exited $($u.ExitCode)" }
          if (Test-Path (Join-Path $dir 'lapsecoin.exe')) { $failures += "uninstall left the program behind" }
          foreach ($lnk in $shortcuts) {
            if (Test-Path $lnk) { $failures += "uninstall left $lnk behind" }
          }

          if ($failures) { $failures | ForEach-Object { Write-Host "FAILED: $_" }; exit 1 }
          Write-Host "install, start and uninstall all worked"

      # Removing the program must also stop a node that is running. One left
      # running holds the data folder's lock and database, which blocks the next
      # copy from starting and from moving the data (scripts/test_msi_uninstall.ps1).
      - name: Check that uninstalling stops a running app
        shell: pwsh
        timeout-minutes: 10
        run: .\scripts\test_msi_uninstall.ps1 -Msi lapsecoin.msi

      # The Microsoft Store build (see build_msix.ps1 and store.yml). Built
      # only when the Partner Center identity is set as repo variables, so a
      # fork without them still releases the MSI as before.
      - name: Build the Microsoft Store package
        if: vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_DISPLAY_NAME != ''
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          $v = (Get-Content VERSION).Trim()
          .\scripts\build_msix.ps1 -Source dist\lapsecoin-win -Version $v `
            -Name $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER `
            -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME -DisplayName $env:MSIX_DISPLAY_NAME `
            -Out lapsecoin.msix

      # Installs the package on the runner and checks the wallet is made in
      # the profile folder and survives an upgrade and an uninstall. A failure
      # stops the release, because a package that loses wallets must not ship.
      - name: Test the Microsoft Store package
        if: vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_DISPLAY_NAME != ''
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          $v = (Get-Content VERSION).Trim()
          .\scripts\test_msix.ps1 -Source dist\lapsecoin-win -Version $v -Msix lapsecoin.msix

      - name: Stage the release files
        shell: pwsh
        run: |
          New-Item stage -ItemType Directory | Out-Null
          Copy-Item lapsecoin.msi                stage\lapsecoin.msi
          if (Test-Path lapsecoin.msix) { Copy-Item lapsecoin.msix stage\lapsecoin.msix }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: lapsecoin-windows
          path: stage/*

  publish-pypi:
    # After the release job, which itself waits for the tests and both builds
    # (and holds the VirusTotal scan and the notes), so a version never
    # reaches PyPI, where it cannot be taken back, unless the GitHub release
    # with its binaries was created.
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing (OIDC): PyPI checks this token against the
      # pending publisher registered on the project page (repo + this
      # workflow file), so there's no PYPI_API_TOKEN secret to hold or
      # rotate. First successful publish from here claims the project
      # under whichever PyPI account registered that pending publisher.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI never accepts the same version twice, so a re-run of the
          # release at the same version skips the upload instead of failing.
          skip-existing: true

  release:
    needs: [version, test, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v6
        with:
          name: lapsecoin-linux
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v6
        with:
          name: lapsecoin-windows
          path: artifacts/windows

      - name: Make AppImage executable
        run: chmod +x artifacts/linux/lapsecoin

      - name: Checksums
        run: |
          cd artifacts
          sha256sum linux/lapsecoin windows/lapsecoin.msi* \
            | sed 's# \(linux\|windows\)/# #' > SHA256SUMS
          cat SHA256SUMS

      # Uploads the installer to VirusTotal and keeps the summary for the
      # release notes. The key is the VT_API_KEY repo secret; with no key, or
      # on any failure, the script prints nothing and the release goes on.
      - name: Scan the installer on VirusTotal
        # Whatever happens here, even a hang, must not fail the release: the
        # script gives up after 15 minutes, this is the backstop.
        continue-on-error: true
        timeout-minutes: 20
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: python3 scripts/virustotal.py artifacts/windows/lapsecoin.msi /tmp/vt-badge.md > /tmp/vt.md || true

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "${{ needs.version.outputs.tag }}" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          git log "$RANGE" --shortstat --pretty=format:"%h %s" | awk '
            /^[a-f0-9]/ { hash=$0 }
            /files? changed/ {
              match($0, /([0-9]+) insertion/, ins)
              match($0, /([0-9]+) deletion/, del)
              total = ins[1] + del[1]
              print total " " hash
            }
          ' | sort -rn | head -5 | awk '{$1=""; print NR"."$0}' > /tmp/largest.txt

          SEVERITY="${{ needs.version.outputs.severity }}"
          case "$SEVERITY" in
            protocol) SEVERITY_LINE="**Protocol change**: old and new nodes may not sync with each other. Upgrade recommended." ;;
            critical) SEVERITY_LINE="**Critical update**: upgrading is recommended." ;;
            *)        SEVERITY_LINE="Routine update." ;;
          esac

          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          # The VirusTotal badge sits after the version in the heading; with no
          # scan result the heading is just the version.
          BADGE=$(cat /tmp/vt-badge.md 2>/dev/null || true)
          if [ -n "$BADGE" ]; then
            echo "## ${{ needs.version.outputs.tag }}  $BADGE" >> "$GITHUB_OUTPUT"
          else
            echo "## ${{ needs.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
          echo "" >> "$GITHUB_OUTPUT"
          echo "$SEVERITY_LINE" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Windows: the installer is not code signed, so SmartScreen may warn on first run (More info, then Run anyway). Check the download against SHA256SUMS." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          cat /tmp/vt.md >> "$GITHUB_OUTPUT" 2>/dev/null || true
          echo "" >> "$GITHUB_OUTPUT"
          echo "### 5 largest commits" >> "$GITHUB_OUTPUT"
          cat /tmp/largest.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.title }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: |
            artifacts/linux/lapsecoin
            artifacts/windows/lapsecoin.msi*
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Puts the installer at a URL that does not redirect, for the Microsoft
  # Store (see pages.yml). Not part of revert-on-failure: the release is
  # already public by now, and a failed copy can be re-run on its own.
  publish-pages:
    needs: [version, release]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  # Submits the new Store package to the Microsoft Store (see store.yml).
  # Skips itself without the Partner Center secrets, and like publish-pages it
  # is not part of revert-on-failure: a failed submission is re-run on its own.
  publish-store:
    needs: [version, release]
    permissions:
      contents: read
    uses: ./.github/workflows/store.yml
    with:
      version: ${{ needs.version.outputs.tag }}
    secrets: inherit

  revert-on-failure:
    # publish-pypi deliberately isn't in this list: it runs after the
    # release job, so the GitHub release with real binaries is public whether
    # or not the publish works, and rolling the version back would just
    # orphan it. A failed PyPI publish should fail
    # loudly and get re-run on its own (skip-existing makes that safe), not
    # roll back a release that already succeeded.
    needs: [version, set-genesis, test, build-linux, build-windows, release]
    runs-on: ubuntu-latest
    if: |
      always() && (
        needs.version.result       == 'failure' ||
        needs.set-genesis.result   == 'failure' ||
        needs.test.result          == 'failure' ||
        needs.build-linux.result   == 'failure' ||
        needs.build-windows.result == 'failure' ||
        needs.release.result       == 'failure'
      )
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revert VERSION and GENESIS_TIMESTAMP
        run: |
          PREV="${{ needs.version.outputs.prev_ver }}"
          TAG="${{ needs.version.outputs.tag }}"
          if [ -z "$PREV" ]; then
            echo "No previous version available -- cannot revert"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          echo "$PREV" > VERSION
          if [ "${{ vars.TESTNET }}" = "True" ]; then
            sed -i "s/^GENESIS_TIMESTAMP = .*/GENESIS_TIMESTAMP = 0/" src/params.py
            git add VERSION src/params.py
          else
            git add VERSION
          fi
          git commit -m "revert: VERSION back to $PREV ($TAG release failed)"
          git push origin main
          git push origin :refs/tags/$TAG || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
