name: MSIX lab (temporary experiment)

# Throwaway. Builds a tiny full-trust MSIX in three flavours, installs, upgrades
# and uninstalls it on a Windows runner, and prints where its files end up.

on: workflow_dispatch

jobs:
  lab:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Run the lab
        shell: pwsh
        run: ./.github/lab/msix_lab.ps1
