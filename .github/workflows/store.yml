name: Update the Microsoft Store listing

# Submits the MSIX of a release to the Microsoft Store for certification. The
# package is built by release.yml (scripts/build_msix.ps1) and attached to the
# GitHub release; this downloads it from there, checks it against SHA256SUMS
# and hands it to the Store, which signs it itself.
#
# Runs after every release (called from release.yml) and by hand from the
# Actions tab, which resubmits the version you name, or the one in VERSION.
# Docs: https://learn.microsoft.com/windows/apps/publish/msstore-dev-cli/commands
#
# One-time setup, in Partner Center and the repo (Settings > Secrets and
# variables > Actions):
#   1. Register an application in Microsoft Entra ID and add it under Account
#      settings > Microsoft Entra applications in Partner Center, role Manager.
#   2. Secrets: AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID,
#      AZURE_AD_APPLICATION_SECRET, SELLER_ID.
#   3. Variables (not secrets), from the product identity page of the MSIX
#      product: MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME
#      and MSIX_DISPLAY_NAME (the reserved app name), used by release.yml to
#      build the package, and MSIX_STORE_ID (the 12 character Store ID), used
#      here.
#   4. The first version of the product must be submitted by hand in Partner
#      Center, including the justification for the runFullTrust capability.
#      The Store only takes free apps through this route.
# Without the secrets and MSIX_STORE_ID this does nothing and says so.
#
# A version that was submitted is never rebuilt under the same number.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      AZURE_AD_TENANT_ID:
        required: false
      AZURE_AD_APPLICATION_CLIENT_ID:
        required: false
      AZURE_AD_APPLICATION_SECRET:
        required: false
      SELLER_ID:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version to submit, like 1.1.3 (default: the one in VERSION)"
        type: string
        required: false

concurrency:
  group: store
  cancel-in-progress: false

env:
  STORE_ID: ${{ vars.MSIX_STORE_ID }}

jobs:
  submit:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      SELLER_ID: ${{ secrets.SELLER_ID }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Check the Store credentials are set
        id: gate
        run: |
          $missing = 'AZURE_AD_TENANT_ID', 'AZURE_AD_APPLICATION_CLIENT_ID', 'AZURE_AD_APPLICATION_SECRET', 'SELLER_ID', 'STORE_ID' |
            Where-Object { -not (Get-Item "env:$_" -ErrorAction SilentlyContinue).Value }
          if ($missing) {
            Write-Host "Skipping the Store update, these secrets or variables (STORE_ID is the MSIX_STORE_ID variable) are not set: $($missing -join ', ')"
            "enabled=false" | Out-File $env:GITHUB_OUTPUT -Append
          } else {
            "enabled=true" | Out-File $env:GITHUB_OUTPUT -Append
          }

      - name: Work out the version
        if: steps.gate.outputs.enabled == 'true'
        id: ver
        run: |
          $v = ("${{ inputs.version }}".Trim()) -replace '^v', ''
          if (-not $v) { $v = (Get-Content VERSION -Raw).Trim() }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Not a version: '$v'" }
          "version=$v" | Out-File $env:GITHUB_OUTPUT -Append

      # The package the Store gets must be the very file the release published.
      - name: Download the package and check it is the release's
        if: steps.gate.outputs.enabled == 'true'
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item pkg -ItemType Directory | Out-Null
          gh release download "v$v" --repo $env:GITHUB_REPOSITORY --pattern lapsecoin.msix --dir pkg
          if ($LASTEXITCODE) { throw "v$v has no lapsecoin.msix. Are the MSIX_IDENTITY_* variables set?" }
          gh release download "v$v" --repo $env:GITHUB_REPOSITORY --pattern SHA256SUMS --output SHA256SUMS
          $line = Get-Content SHA256SUMS | Where-Object { $_ -match '\slapsecoin\.msix$' } | Select-Object -First 1
          if (-not $line) { throw "No lapsecoin.msix in the release's SHA256SUMS" }
          $want = ($line -split '\s+')[0].ToLower()
          $got = (Get-FileHash pkg\lapsecoin.msix -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "The downloaded package ($got) is not the release's ($want)" }
          Write-Host "OK, lapsecoin.msix matches the release ($got)"

      - uses: microsoft/microsoft-store-apppublisher@v1.1
        if: steps.gate.outputs.enabled == 'true'

      - name: Sign in to Partner Center
        if: steps.gate.outputs.enabled == 'true'
        run: |
          msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          if ($LASTEXITCODE) { throw "msstore reconfigure failed" }

      # publish replaces the pending draft with one built from the last
      # published submission, so listing text and pricing carry over.
      - name: Submit for certification
        if: steps.gate.outputs.enabled == 'true'
        run: |
          $status = msstore submission status $env:STORE_ID 2>&1 | Out-String
          Write-Host $status
          if ($status -match '"OngoingSubmissionId":\s*"([^"]+)"') {
            throw "Submission $($Matches[1]) is already in progress for this app. Wait for it to finish, then run this again."
          }
          msstore publish pkg --inputFile pkg\lapsecoin.msix --appId $env:STORE_ID --verbose
          if ($LASTEXITCODE) {
            throw "msstore publish failed. The first version must be submitted by hand in Partner Center."
          }
          Write-Host "Submitted. The new version reaches Store users once certification finishes."
