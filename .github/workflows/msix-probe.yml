name: Check the packaged data folder logic on Windows

# Runs the real src/datadir.py inside an MSIX package on a Windows runner,
# without building the program (which takes half an hour). The package holds a
# copy of the runner's Python, started under the name lapsecoin.exe, and runs a
# few lines that call datadir.prepare() the way main.py does. It checks, with
# Windows itself, that:
#   - GetCurrentPackageFullName reports the process as packaged
#   - the data folder is %USERPROFILE%\LapseCoin
#   - the data of an earlier MSI install in %LOCALAPPDATA%\LapseCoin is moved
#     across (a move, so the old folder is gone afterwards), which Windows could
#     in principle forbid a packaged app from doing to files outside the package
#   - the moved wallet survives an uninstall of the package
#   - a failure leaves lapsecoin-crash.log and lapsecoin-start.log in the profile
#     folder (src/crashlog.py), from a packaged process
#   - the launcher (launcher/Launch.cs) reports a fault exit code or a refusal to
#     start, and nothing else, with the person's name, folders and addresses removed
# This does not replace scripts/test_msix.ps1, which tests the real program
# and runs on every release. It exists so a mistake in the data folder logic
# shows up here in a minute instead of blocking a release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/datadir.py
      - src/crashlog.py
      - launcher/**
      - scripts/build_launcher.ps1
      - scripts/build_msix.ps1
      - scripts/AppxManifest.template.xml
      - .github/workflows/msix-probe.yml

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build a package that runs datadir.prepare()
        run: |
          $probe = "$PWD\probe"
          New-Item $probe -ItemType Directory | Out-Null
          robocopy $env:pythonLocation $probe /E /XD site-packages Doc include libs Scripts tcl __pycache__ /NFL /NDL /NJH /NJS | Out-Null
          Copy-Item "$probe\python.exe" "$probe\lapsecoin.exe"
          New-Item "$probe\src" -ItemType Directory | Out-Null
          Copy-Item src\*.py "$probe\src"
          Copy-Item scripts\*.py "$probe\src" -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 64, 64
          $bmp.Save("$probe\lapsecoin.png", [System.Drawing.Imaging.ImageFormat]::Png)
          @'
          import os, sys
          sys.path.insert(0, os.path.join(os.path.dirname(os.path.abspath(__file__)), "src"))
          sys.argv = ["probe", "--no-gui"]
          import datadir
          print("packaged:", datadir.is_packaged(), flush=True)
          print("prepare:", datadir.prepare(), flush=True)
          print("cwd:", os.getcwd(), flush=True)
          print("done", flush=True)
          '@ -replace '(?m)^ {10}', '' | Set-Content "$probe\probe.py" -Encoding ascii
          @'
          import os, sys
          sys.path.insert(0, os.path.join(os.path.dirname(os.path.abspath(__file__)), "src"))
          import crashlog
          crashlog.install()   # with --crash-test this raises, and the hook must leave a report
          '@ -replace '(?m)^ {10}', '' | Set-Content "$probe\probe_crash.py" -Encoding ascii
          Remove-Item "$probe\*.pyc" -ErrorAction SilentlyContinue

          # The certificate must carry the manifest's publisher, and Windows
          # must be told to trust it.
          $pub = "CN=LapseCoinProbe"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $pub -KeyUsage DigitalSignature `
            -FriendlyName "LapseCoin probe" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-PfxCertificate -Cert $cert -FilePath probe.pfx -Password (ConvertTo-SecureString "probe" -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath probe.cer | Out-Null
          Import-Certificate -FilePath probe.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowAllTrustedApps /t REG_DWORD /d 1 /f | Out-Null

          .\scripts\build_msix.ps1 -Source $probe -Version 1.0.0 -Name LapseCoin.Probe -Publisher $pub `
            -PublisherDisplayName "LapseCoin probe" -DisplayName "LapseCoin probe" -Out probe.msix
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f probe.pfx /p probe probe.msix | Out-Null
          if ($LASTEXITCODE) { throw "signtool failed" }

      - name: Run it as the MSI build's user would find it
        run: |
          $failures = @()
          $wallet = "lapsecoin_wallet.json"
          $legacy = Join-Path $env:LOCALAPPDATA "LapseCoin"
          $data = Join-Path $env:USERPROFILE "LapseCoin"
          Remove-Item $legacy, $data -Recurse -Force -ErrorAction SilentlyContinue
          # An existing MSI install, made before the package is installed.
          New-Item $legacy -ItemType Directory | Out-Null
          Set-Content (Join-Path $legacy $wallet) "legacy wallet" -NoNewline

          Add-AppxPackage -Path probe.msix
          $pkg = Get-AppxPackage -Name LapseCoin.Probe
          New-Item C:\probe-out -ItemType Directory -Force | Out-Null
          Remove-Item C:\probe-out\probe.log -ErrorAction SilentlyContinue
          $cmd = "/c cd /d `"$($pkg.InstallLocation)`" && lapsecoin.exe probe.py > C:\probe-out\probe.log 2>&1"
          Invoke-CommandInDesktopPackage -PackageFamilyName $pkg.PackageFamilyName -AppId LapseCoin -Command "cmd.exe" -Args $cmd
          for ($i = 0; $i -lt 60 -and -not ((Test-Path C:\probe-out\probe.log) -and (Get-Content C:\probe-out\probe.log -Raw) -match 'done'); $i++) { Start-Sleep 2 }
          $log = if (Test-Path C:\probe-out\probe.log) { Get-Content C:\probe-out\probe.log -Raw } else { "" }
          Write-Host $log

          if ($log -notmatch 'packaged: True') { $failures += "datadir.is_packaged() did not report a package" }
          if ($log -notmatch [regex]::Escape("prepare: $data")) { $failures += "datadir.prepare() did not choose $data" }
          if (-not (Test-Path (Join-Path $data $wallet))) { $failures += "the wallet was not moved to $data" }
          elseif ((Get-Content (Join-Path $data $wallet) -Raw) -ne "legacy wallet") { $failures += "the moved wallet differs from the original" }
          if (Test-Path (Join-Path $legacy $wallet)) { $failures += "the wallet is still in $legacy, so it was copied or the move was undone" }

          # A failure while the program is loading must leave a report.
          $cmd2 = "/c cd /d `"$($pkg.InstallLocation)`" && set LAPSECOIN_CRASHLOG=1&& set LAPSECOIN_NO_DIALOGS=1&& lapsecoin.exe probe_crash.py --crash-test"
          Invoke-CommandInDesktopPackage -PackageFamilyName $pkg.PackageFamilyName -AppId LapseCoin -Command "cmd.exe" -Args $cmd2
          $report = Join-Path $data "lapsecoin-crash.log"
          for ($i = 0; $i -lt 30 -and -not ((Test-Path $report) -and (Select-String -Path $report -Pattern 'crash test requested' -Quiet)); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $report) -or -not (Select-String -Path $report -Pattern 'crash test requested' -Quiet)) { $failures += "a crash left no report in $data" }
          if (-not (Test-Path (Join-Path $data "lapsecoin-start.log"))) { $failures += "a crash left no start log in $data" }
          if (Test-Path $report) { Get-Content $report -Tail 12 | Write-Host }

          Remove-AppxPackage -Package $pkg.PackageFullName
          Start-Sleep 5
          if (-not (Test-Path (Join-Path $data $wallet))) { $failures += "the uninstall deleted the wallet in $data" }

          if ($failures) { $failures | ForEach-Object { Write-Host "FAILED: $_" }; exit 1 }
          Write-Host "packaged: the data folder is $data, the MSI wallet was moved across and it survived the uninstall"

      # The launcher starts the program and reports a crash that happens before the
      # program's own code can. Each case below runs it against a tiny test program
      # and reads what it would have sent (LAPSECOIN_CRASH_DRYRUN writes it to a file).
      - name: Check the launcher
        run: |
          $failures = @()
          .\scripts\build_launcher.ps1 -OutDir launcher-out
          $csc = Join-Path $env:windir "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          New-Item child -ItemType Directory | Out-Null
          $kids = @{
            fault = 'class P { static int Main() { return unchecked((int)0xC0000135); } }'
            ok    = 'class P { static int Main() { return 0; } }'
            one   = 'class P { static int Main() { return 1; } }'
            args  = 'class P { static int Main(string[] a) { return a.Length * 10 + (a.Length > 0 && a[0] == "two words" ? 1 : 0); } }'
          }
          foreach ($k in $kids.Keys) {
            Set-Content "child\$k.cs" $kids[$k]
            & $csc /nologo "/out:child\$k.exe" "child\$k.cs"
            if ($LASTEXITCODE) { throw "could not compile the $k test program" }
          }
          # the program's own start log, with a folder of this account and an address in it
          $logs = Join-Path $env:USERPROFILE "LapseCoin"
          New-Item $logs -ItemType Directory -Force | Out-Null
          Set-Content (Join-Path $logs "lapsecoin-start.log") ("start data folder ready: $env:USERPROFILE\LapseCoin`n" + "bid.catch.flower.smart.eyebrow.polar.staff.view.diesel.pioneer.horn.couple")

          function Launch($child, $arguments = @(), $optOut = $false) {
            $report = Join-Path $PWD "report.txt"
            Remove-Item $report -ErrorAction SilentlyContinue
            $env:LAPSECOIN_LAUNCHER_CHILD = $child
            $env:LAPSECOIN_CRASH_DRYRUN = $report
            if ($optOut) { $env:LAPSECOIN_CRASH_REPORTS = "0" } else { Remove-Item env:LAPSECOIN_CRASH_REPORTS -ErrorAction SilentlyContinue }
            $p = Start-Process "launcher-out\lapsecoin-launch.exe" -ArgumentList $arguments -Wait -PassThru
            [pscustomobject]@{ Code = $p.ExitCode; Report = $(if (Test-Path $report) { Get-Content $report -Raw } else { $null }) }
          }

          $r = Launch (Join-Path $PWD "child\fault.exe")
          if ($r.Code -ne -1073741515) { $failures += "the launcher did not pass on the exit code (got $($r.Code))" }
          if (-not $r.Report) { $failures += "a fault exit code was not reported" }
          else {
            Write-Host $r.Report
            if ($r.Report -notmatch "0xC0000135") { $failures += "the report does not name the exit code" }
            if ($r.Report -notmatch "Crash Lc0000135") { $failures += "the report has no signature in its title" }
            foreach ($secret in $env:USERNAME, $env:USERPROFILE, "bid.catch") {
              if ($r.Report -match [regex]::Escape($secret)) { $failures += "the report still holds '$secret'" }
            }
          }
          foreach ($quiet in "ok", "one") {
            $r = Launch (Join-Path $PWD "child\$quiet.exe")
            if ($r.Report) { $failures += "a normal exit ($quiet) was reported" }
          }
          $r = Launch (Join-Path $PWD "child\nowhere.exe")
          if (-not $r.Report -or $r.Report -notmatch "would not start" -or $r.Report -notmatch "Lstart2") { $failures += "a program Windows would not start was not reported" }
          $r = Launch (Join-Path $PWD "child\fault.exe") @() $true
          if ($r.Report) { $failures += "a report was made although reporting was switched off" }
          $r = Launch (Join-Path $PWD "child\args.exe") @('"two words"', 'x')
          if ($r.Code -ne 21) { $failures += "the launcher mangled the arguments (exit code $($r.Code), wanted 21)" }
          Remove-Item $logs -Recurse -Force -ErrorAction SilentlyContinue

          if ($failures) { $failures | ForEach-Object { Write-Host "FAILED: $_" }; exit 1 }
          Write-Host "the launcher reports a fault and a refusal to start, and nothing else, without names, folders or addresses"
