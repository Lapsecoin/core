name: Build the Microsoft Store package by hand

# Makes lapsecoin.msix from an existing release without releasing anything:
# it downloads that release's MSI, installs it on the runner, takes the
# program files, drops the MSI marker and packs the rest with
# scripts/build_msix.ps1. The program inside is the release's own, only
# repackaged, so the result can be uploaded to Partner Center as the first
# submission. It then installs the package on the runner and checks the wallet
# survives an upgrade and an uninstall. Nothing is published or sent to the
# Store here. The test-signed copy and the Sandbox scripts go to the "sandbox-test"
# prerelease (not a real release: the Pages site and the updater ignore it), where
# scripts/sandbox/Start-Sandbox.ps1 fetches them.
#
# Run it from the Actions tab. It needs the MSIX_IDENTITY_NAME, MSIX_PUBLISHER,
# MSIX_PUBLISHER_DISPLAY_NAME and MSIX_DISPLAY_NAME repo variables (see
# store.yml). The package is the "lapsecoin-msix" artifact of the run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to repackage, like 1.1.4 (default: the latest release)"
        type: string
        required: false
      runner:
        description: "Runner to build and test on. windows-11-arm runs the x64 package under emulation, as on an ARM laptop"
        type: choice
        options: [windows-latest, windows-11-arm]
        default: windows-latest
      soak_minutes:
        description: "Keep the app running this many minutes and report if it dies (0 to skip)"
        type: string
        default: "0"

jobs:
  build:
    runs-on: ${{ inputs.runner || 'windows-latest' }}
    timeout-minutes: 40
    permissions:
      contents: write     # for the sandbox-test prerelease below
    env:
      GH_TOKEN: ${{ github.token }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
      MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Check the identity variables are set
        run: |
          $missing = 'MSIX_IDENTITY_NAME', 'MSIX_PUBLISHER', 'MSIX_PUBLISHER_DISPLAY_NAME', 'MSIX_DISPLAY_NAME' |
            Where-Object { -not (Get-Item "env:$_").Value }
          if ($missing) { throw "These repo variables are not set: $($missing -join ', ')" }

      - name: Download the release's installer
        id: rel
        run: |
          $v = ("${{ inputs.version }}".Trim()) -replace '^v', ''
          if ($v) { $tag = "v$v" } else { $tag = (gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName) }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Not a release tag: '$tag'" }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern lapsecoin.msi
          if ($LASTEXITCODE) { throw "$tag has no lapsecoin.msi" }
          "version=$($Matches[1])" | Out-File $env:GITHUB_OUTPUT -Append

      # A normal per-user install, then the files are copied out of it.
      - name: Install it and copy the program files
        run: |
          $p = Start-Process msiexec -ArgumentList '/i', "$PWD\lapsecoin.msi", '/qn', 'LAUNCH=0' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install exited $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\LapseCoin'
          Copy-Item $dir app -Recurse
          Remove-Item app\installed-by-msi
          $u = Start-Process msiexec -ArgumentList '/x', "$PWD\lapsecoin.msi", '/qn' -Wait -PassThru
          Get-ChildItem app | Select-Object -First 20 | Format-Table Name, Length

      - name: Build the package
        run: |
          .\scripts\build_msix.ps1 -Source app -Version "${{ steps.rel.outputs.version }}" `
            -Name $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER `
            -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME -DisplayName $env:MSIX_DISPLAY_NAME `
            -Out lapsecoin.msix
          (Get-FileHash lapsecoin.msix -Algorithm SHA256).Hash | Write-Host

      # The same check the release runs: install, first run, upgrade and
      # uninstall must all leave the wallet in %USERPROFILE%\LapseCoin.
      - name: Test the package
        run: |
          .\scripts\test_msix.ps1 -Source app -Version "${{ steps.rel.outputs.version }}" -Msix lapsecoin.msix -SoakMinutes ${{ inputs.soak_minutes || 0 }}

      # The package above is unsigned (the Store signs it), so it cannot be
      # installed on a normal PC. This keeps the copy the test signed with its
      # throwaway certificate, plus the public certificate, so the exact package
      # can be tried on a real Windows 11 machine: import the .cer into Local
      # Machine > Trusted People (as administrator), then open the .msix.
      - name: Keep a test-signed copy for a real PC
        if: always()
        run: |
          New-Item testpkg -ItemType Directory -Force | Out-Null
          Copy-Item msix-test\v1.msix testpkg\lapsecoin-test-signed.msix -ErrorAction SilentlyContinue
          Copy-Item msix-test\test.cer testpkg\lapsecoin-test.cer -ErrorAction SilentlyContinue
          # and the scripts that try it in Windows Sandbox on a PC (scripts/sandbox/Start-Sandbox.ps1)
          Copy-Item scripts\sandbox\* testpkg\

      # A public place the Sandbox script can download from (an artifact needs a login). One
      # rolling prerelease, replaced on every run. It carries no lapsecoin.msi and is a
      # prerelease, so build_pages_site.py skips it, and the updater reads VERSION, not releases.
      - name: Publish the test copy for the Sandbox script
        if: success()
        run: |
          gh release view sandbox-test --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE) {
            gh release create sandbox-test --prerelease --target main `
              --title "Sandbox test package (not a release)" `
              --notes "The released app repackaged and signed with a throwaway certificate, to try in Windows Sandbox with scripts/sandbox/Start-Sandbox.ps1. Replaced on every run of the 'Build the Microsoft Store package by hand' workflow. Not for general use."
            if ($LASTEXITCODE) { throw "could not create the sandbox-test prerelease" }
          }
          gh release upload sandbox-test (Get-ChildItem testpkg).FullName --clobber
          if ($LASTEXITCODE) { throw "could not upload the test package" }

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lapsecoin-msix-test-signed
          path: testpkg/*
          if-no-files-found: warn

      # Microsoft's own certification test tool. It is not the Store's full
      # certification, and it may not run on every runner image, so it never
      # fails the job; it prints what it found.
      - name: Run the Windows App Certification Kit
        if: always()
        continue-on-error: true
        run: |
          $kit = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $kit) { Write-Host "The App Certification Kit is not installed on this runner"; exit 0 }
          & $kit.FullName reset | Out-Null
          & $kit.FullName test -appxpackagepath "$PWD\msix-test\v1.msix" -reportoutputpath "$PWD\wack.xml"
          if (Test-Path wack.xml) {
            [xml]$r = Get-Content wack.xml
            Write-Host "overall: $($r.REPORT.OVERALL_RESULT)"
            foreach ($t in $r.SelectNodes("//TEST")) {
              Write-Host ("{0,-8} {1}" -f $t.RESULT.InnerText, $t.NAME)
            }
          } else { Write-Host "no report was written" }

      - uses: actions/upload-artifact@v6
        with:
          name: lapsecoin-msix
          path: lapsecoin.msix
