name: Check the launcher on Windows

# Builds the launcher (launcher/Launch.cs) on a Windows runner and checks it:
#   - it reports a fault exit code or a refusal to start, and nothing else, with
#     the person's name, folders, addresses and other private text removed
#   - it explains the exit code and names a library Windows does not have
#   - its cleaning rules give the same answers as src/crashlog.py's, by running
#     tests/scrub_cases.json through it
# The launcher compiles in a few seconds, so this runs on every change to it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/crashlog.py
      - launcher/**
      - tests/scrub_cases.json
      - scripts/build_launcher.ps1
      - .github/workflows/launcher-probe.yml

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      # The launcher starts the program and reports a crash that happens before the
      # program's own code can. Each case below runs it against a tiny test program
      # and reads what it would have sent (LAPSECOIN_CRASH_DRYRUN writes it to a file).
      - name: Check the launcher
        run: |
          $failures = @()
          # With an icon too, as the release build has one (a lone icon argument once broke it).
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 32, 32
          $ico = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $fs = [System.IO.File]::Create("probe.ico"); $ico.Save($fs); $fs.Close()
          .\scripts\build_launcher.ps1 -OutDir launcher-out -Icon probe.ico
          $csc = Join-Path $env:windir "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          New-Item child -ItemType Directory | Out-Null
          $kids = @{
            fault = 'class P { static int Main() { return unchecked((int)0xC0000135); } }'
            ok    = 'class P { static int Main() { return 0; } }'
            one   = 'class P { static int Main() { return 1; } }'
            args  = 'class P { static int Main(string[] a) { return a.Length * 10 + (a.Length > 0 && a[0] == "two words" ? 1 : 0); } }'
          }
          foreach ($k in $kids.Keys) {
            Set-Content "child\$k.cs" $kids[$k]
            & $csc /nologo "/out:child\$k.exe" "child\$k.cs"
            if ($LASTEXITCODE) { throw "could not compile the $k test program" }
          }
          # the program's own start log, with a folder of this account and an address in it
          $logs = Join-Path $env:USERPROFILE "LapseCoin"
          New-Item $logs -ItemType Directory -Force | Out-Null
          Set-Content (Join-Path $logs "lapsecoin-start.log") ("2026-10-21 07:10:51 start data folder ready: $env:USERPROFILE\LapseCoin`n" + "bid.catch.flower.smart.eyebrow.polar.staff.view.diesel.pioneer.horn.couple`n" + "2026-10-21 07:10:52 peer 203.0.113.7:8333 passphrase=hunter2 for $env:USERNAME")
          # and a native crash dump like the one Python's faulthandler leaves, with the program's own
          # files in it and Python's (threading.py) among them
          Set-Content (Join-Path $logs "lapsecoin-crash.log") ("===== 2026-10-21 07:10:55 =====`nWindows fatal exception: access violation`n`nThread 0x00002bcc (most recent call first):`n" +
            "  File `"$env:USERPROFILE\p\gui.py`", line ??? in run_status_window`n  File `"$env:USERPROFILE\p\threading.py`", line 982 in run`n  File `"$env:USERPROFILE\p\main.py`", line 17 in main`n")
          # the list of the program's own files and the version, which the build puts beside the program
          Set-Content launcher-out\OWN_MODULES "main.py`nsrc/gui.py" -Encoding ascii
          Set-Content launcher-out\VERSION "9.9.9" -NoNewline -Encoding ascii

          function Launch($child, $arguments = @(), $optOut = $false) {
            $report = Join-Path $PWD "report.txt"
            Remove-Item $report -ErrorAction SilentlyContinue
            $env:LAPSECOIN_LAUNCHER_CHILD = $child
            # a target, so the report knows its repository for the code links (a dry run sends nothing)
            $env:LAPSECOIN_CRASH_REPO = "Lapsecoin/core"; $env:LAPSECOIN_CRASH_TOKEN = "dry-run"
            $env:LAPSECOIN_CRASH_DRYRUN = $report
            if ($optOut) { $env:LAPSECOIN_CRASH_REPORTS = "0" } else { Remove-Item env:LAPSECOIN_CRASH_REPORTS -ErrorAction SilentlyContinue }
            $p = Start-Process "launcher-out\lapsecoin-launch.exe" -ArgumentList $arguments -Wait -PassThru
            [pscustomobject]@{ Code = $p.ExitCode; Report = $(if (Test-Path $report) { Get-Content $report -Raw } else { $null }) }
          }

          $r = Launch (Join-Path $PWD "child\fault.exe")
          if ($r.Code -ne -1073741515) { $failures += "the launcher did not pass on the exit code (got $($r.Code))" }
          if (-not $r.Report) { $failures += "a fault exit code was not reported" }
          else {
            Write-Host $r.Report
            if ($r.Report -notmatch "launcher: the program ended with exit code 0xC0000135 after") { $failures += "the report does not say what happened to the program" }
            if ($r.Report -notmatch "Crash Lc0000135") { $failures += "the report has no signature in its title" }
            foreach ($secret in $env:USERNAME, $env:USERPROFILE, "bid.catch", "203.0.113.7", "hunter2", "2026-10-21") {
              if ($r.Report -match [regex]::Escape($secret)) { $failures += "the report still holds '$secret'" }
            }
            if ($r.Report -notmatch "Windows fatal exception: access violation") { $failures += "the report lacks the crash dump's first line" }
            if ($r.Report -notmatch "\+0s" -or $r.Report -notmatch "\+4s") { $failures += "dates and times were not turned into seconds" }
            if ($r.Report -notmatch [regex]::Escape("blob/v9.9.9/src/gui.py)")) { $failures += "no link to gui.py at the release tag" }
            if ($r.Report -notmatch [regex]::Escape("blob/v9.9.9/main.py#L17")) { $failures += "no link to main.py with its line" }
            if ($r.Report -match "threading\.py\]") { $failures += "a Python library file was linked as the program's code" }
          }
          foreach ($quiet in "ok", "one") {
            $r = Launch (Join-Path $PWD "child\$quiet.exe")
            if ($r.Report) { $failures += "a normal exit ($quiet) was reported" }
          }
          $r = Launch (Join-Path $PWD "child\nowhere.exe")
          if (-not $r.Report -or $r.Report -notmatch "would not start" -or $r.Report -notmatch "Lstart2") { $failures += "a program Windows would not start was not reported" }
          $r = Launch (Join-Path $PWD "child\fault.exe") @() $true
          if ($r.Report) { $failures += "a report was made although reporting was switched off" }
          $r = Launch (Join-Path $PWD "child\args.exe") @('"two words"', 'x')
          if ($r.Code -ne 21) { $failures += "the launcher mangled the arguments (exit code $($r.Code), wanted 21)" }
          # What the report says about an exit code, and what a missing library looks like. The
          # launcher is copied with the one library it imports renamed to one Windows does not have.
          $r = Launch (Join-Path $PWD "child\fault.exe")
          if ($r.Report -notmatch "exit code 0xC0000135 \(a DLL the program needs was not found\) after") { $failures += "the report does not explain the exit code" }
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\launcher-out\lapsecoin-launch.exe")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          $replacement = [System.Text.Encoding]::ASCII.GetBytes("xxxxxxx.dll")
          $found = 0
          for ($i = $text.IndexOf("mscoree.dll"); $i -ge 0; $i = $text.IndexOf("mscoree.dll", $i + 1)) {
            [Array]::Copy($replacement, 0, $bytes, $i, $replacement.Length); $found++
          }
          if (-not $found) { $failures += "the launcher does not import mscoree.dll, so the missing-library check has nothing to patch" }
          [System.IO.File]::WriteAllBytes("$PWD\child\patched.exe", $bytes)
          foreach ($case in @(@{ file = "child\patched.exe"; want = $true }, @{ file = "launcher-out\lapsecoin-launch.exe"; want = $false })) {
            $env:LAPSECOIN_IMPORTS_TEST = "$PWD\$($case.file)"
            $env:LAPSECOIN_IMPORTS_OUT = "$PWD\imports.txt"
            Remove-Item imports.txt -ErrorAction SilentlyContinue
            Start-Process "launcher-out\lapsecoin-launch.exe" -Wait
            $said = if (Test-Path imports.txt) { Get-Content imports.txt -Raw } else { "(no file)" }
            Write-Host "imports of $($case.file): $said"
            if ($case.want -and $said -notmatch "missing: xxxxxxx\.dll \(needed by patched\.exe\)") { $failures += "a library Windows does not have was not reported" }
            if (-not $case.want -and $said.Trim()) { $failures += "a program that loads fine was reported as missing libraries: $said" }
          }
          Remove-Item env:LAPSECOIN_IMPORTS_TEST, env:LAPSECOIN_IMPORTS_OUT -ErrorAction SilentlyContinue
          Remove-Item $logs -Recurse -Force -ErrorAction SilentlyContinue

          if ($failures) { $failures | ForEach-Object { Write-Host "FAILED: $_" }; exit 1 }
          Write-Host "the launcher reports a fault and a refusal to start, and nothing else, without names, folders or addresses"

      # The Python tests run tests/scrub_cases.json through src/crashlog.py; this runs the same
      # cases through the launcher's own copy of the rules, so the two cannot drift apart.
      - name: Check the launcher removes what the program does
        run: |
          $spec = Get-Content tests\scrub_cases.json -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($p in $spec.environment.PSObject.Properties) { Set-Item "env:$($p.Name)" $p.Value }
          $dir = Join-Path $PWD "scrub"
          New-Item $dir -ItemType Directory | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding $false
          $i = 0
          foreach ($c in $spec.cases) { [System.IO.File]::WriteAllText("$dir\$i.in", $c.in, $utf8); $i++ }
          $env:LAPSECOIN_SCRUB_TEST = $dir
          $p = Start-Process "launcher-out\lapsecoin-launch.exe" -Wait -PassThru
          if ($p.ExitCode) { throw "the scrub test hook failed ($($p.ExitCode))" }
          $failures = @()
          $i = 0
          foreach ($c in $spec.cases) {
            $got = [System.IO.File]::ReadAllText("$dir\$i.out", $utf8)
            if ($got -ne $c.out) { $failures += "'$($c.name)': wanted [$($c.out)], got [$got]" }
            $i++
          }
          if ($failures) { $failures | ForEach-Object { Write-Host "FAILED: $_" }; exit 1 }
          Write-Host "the launcher removes the same things as the program ($i cases)"
