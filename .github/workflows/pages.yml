name: Publish installers to Pages

# Serves the Windows installers of the latest releases at
#   https://lapsecoin.github.io/core/downloads/<version>/lapsecoin.msi
# (and releases.json beside them, read by lapsecoin.github.io/downloads.html)
# with no redirect (GitHub release links always redirect, which the Microsoft
# Store rejects). The files are copied from the releases into a Pages
# artifact on every run and are never committed to git, so the repo history
# does not grow. Each deploy replaces the site, so the releases stay the
# source of truth and this is only a mirror of the newest ones.
#
# It also serves the whitepaper, rendered as a node shows it, at
#   https://lapsecoin.github.io/core/whitepaper.html
# (scripts/build_whitepaper.py), so a change to docs/whitepaper.md is live on
# the website a minute or two after it reaches main.
#
# One-time setup: Settings > Pages > Source: GitHub Actions.
# Runs after every release (called from release.yml), on a push to main that
# changes the whitepaper or what renders it, and by hand from the Actions tab,
# which rebuilds the site from the releases as they are now.

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/whitepaper.md
      - templates_html/whitepaper.html
      - templates_html/css/pages/whitepaper.css
      - src/whitepaper_render.py
      - scripts/build_whitepaper.py
      - .github/workflows/pages.yml

env:
  # How many of the newest releases stay on the site.
  KEEP: 5

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # The installers of the newest releases plus releases.json, which the
      # downloads page on lapsecoin.github.io reads.
      - name: Mirror the installers of the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          MSIX_STORE_ID: ${{ vars.MSIX_STORE_ID }}
        run: python3 scripts/build_pages_site.py --repo "$GITHUB_REPOSITORY" --keep "$KEEP" --out site && find site -type f | sort

      # The whitepaper page, rendered with the node's own code and styles.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Render the whitepaper
        run: |
          python3 -m pip install "markdown>=3.5" jinja2
          python3 scripts/build_whitepaper.py --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
