name: MSIX real build lab (temporary experiment)

# Throwaway. Packs the real 1.1.4 Windows build as an MSIX on a Windows runner,
# runs the node inside it, and shows where the wallet ends up and what an
# uninstall leaves behind.

on: workflow_dispatch

jobs:
  lab:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Run the lab
        shell: pwsh
        run: ./.github/lab/msix_real.ps1
