[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: pure unit tests (no network, no disk)
    integration: multi-module integration tests (no network)
    e2e: full protocol flow tests (no network)
    real_kdf: keep the production Argon2id cost for this test
