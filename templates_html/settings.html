{% extends "base.html" %}
{% block content %}
<h2>Settings</h2>

{% if alert_ok %}<div class="alert alert-ok">{{ alert_ok }}</div>{% endif %}
{% if alert_err %}<div class="alert alert-err">{{ alert_err }}</div>{% endif %}

<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">

<div class="card">
  <div class="card-title">Node settings</div>
  {% for s in settings %}
  <div class="form-row">
    <label for="{{ s.key }}">{{ s.label }}</label>
    <input type="text" id="{{ s.key }}" name="{{ s.key }}"
           value="{{ s.value }}" {% if s.forced %}disabled{% endif %}>
    <span class="stat-sub">
      {{ s.help }}
      {% if s.forced %}<strong>Set by {{ s.env_name }}.</strong>{% endif %}
    </span>
  </div>
  {% endfor %}
</div>

<button type="submit" style="margin-top:.75rem">Save</button>
</form>
{% endblock %}
